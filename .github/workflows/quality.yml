name: quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 1'

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.7'
      - run: npm ci
      - run: npm run check:docs
      - run: npm run check:text
      - run: npm run check:source
      - run: npm run check:project
      - run: npm run check:expert-reviews
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check:fixture-audio
      - run: npm run check:content
      - run: npm run check:review-candidate
      - run: npm run check:rights-review
      - run: npm run check:assets
      - run: npm run check:fixtures
      - run: npm run check:validator
      - run: npm run test:contracts
      - run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:audio-fixture
      - run: npm run test:review-candidate
      - run: npm run check:product-baseline
      - run: npm run check:expert-reviews:baseline
      - run: npm run test:pwa-update
      - run: npm run qa:ui
      - name: first-party product baseline 영수증 보존
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soombook-product-baseline-${{ github.sha }}
          path: ../soombook.out/product-baseline
          if-no-files-found: error
          retention-days: 30

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:performance
      - run: npm run check:performance-evidence
      - run: npm run check:public-release-evidence
      - run: npm run check:expert-reviews:release
      - run: npm run build:pages
      - run: npm run check:public-release-evidence -- --current-pages
      - run: npm run test:pages:built
      - name: public release evidence 보존
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soombook-public-release-evidence-${{ github.sha }}
          path: |
            ../soombook.out/performance
            ../soombook.out/performance-artifacts
            ../soombook.out/playwright-performance
            ../soombook.out/release-evidence
          if-no-files-found: error
          retention-days: 30

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run qa:device-matrix
      - run: npm run check:expert-reviews:device
      - name: device matrix 영수증 보존
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soombook-device-matrix-${{ github.sha }}
          path: |
            ../soombook.out/device-matrix
            ../soombook.out/playwright-device-matrix
          if-no-files-found: error
          retention-days: 30
